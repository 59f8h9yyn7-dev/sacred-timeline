name: Prove tasselli
on:
  push:
    branches: [prove-tiles]
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scarica
        run: python3 get.py
      - name: Salva
        run: |
          git config user.name "sacred-timeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "tasselli di prova" || exit 0
          git push origin HEAD:prove-tiles
