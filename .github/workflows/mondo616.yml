name: Mondo 616 - dati OpenStreetMap
on:
  push:
    branches: [dati]
    paths: ['tools/world/**']
  workflow_dispatch:
    inputs:
      force:
        description: 'Zone da riscaricare (id separati da spazi, oppure all)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: mondo616-v2
  cancel-in-progress: false
jobs:
  zone:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dati
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely==2.0.6 pillow==11.0.0
      - name: Identità del bot
        run: |
          git config user.name "sacred-timeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: La Terra del globo (immagini NASA, confini e nomi)
        run: |
          python tools/world/earth.py
          git add -A data/world/earth data/world/index.json
          git commit -m "Mondo 616: la Terra del globo" || echo "Terra già pronta"
          for i in 1 2 3 4 5; do
            git pull --rebase origin dati && git push origin HEAD:dati && break
            sleep 7
          done
          git push origin HEAD:main || echo "main non avanzato"
      - name: Scarica e semplifica le zone (si salva dopo ogni zona)
        env:
          COMMIT: '1'
          BUDGET_MIN: '290'
          FORCE: ${{ github.event.inputs.force }}
        run: python tools/world/build.py
      - name: Salva il resto (rami dati e main)
        run: |
          git add -A data/world
          git commit -m "Mondo 616: dati OpenStreetMap" || { echo "niente di nuovo"; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin dati && git push origin HEAD:dati && break
            sleep 7
          done
          git push origin HEAD:main || echo "main non avanzato"
      - name: Se restano zone, riparte da sola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/world/.more ]; then
            echo "restano $(cat data/world/.more) zone: rilancio"
            gh workflow run mondo616.yml --ref dati
          fi
      - name: Pulizia del ramo di prova
        if: always()
        run: git push origin --delete claude/prova-azione || true
