name: Catalogo 616 - posizioni
on:
  push:
    branches: [dati]
    paths: ['tools/catalogo/geo.txt', 'tools/catalogo/geocode.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogo616
  cancel-in-progress: false
jobs:
  posizioni:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dati
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chiedi le posizioni a OpenStreetMap
        run: python tools/catalogo/geocode.py
      - name: Rigenera il catalogo
        run: python tools/catalogo/build.py
      - name: Salva nel repository (rami dati e main)
        run: |
          git config user.name "sacred-timeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalogo/geo-osm.json tools/catalogo/geo-log.txt data/catalogo616.json
          git commit -m "Catalogo 616: posizioni da OpenStreetMap" || { echo "niente di nuovo"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin dati && git push origin HEAD:dati && break
            sleep 7
          done
          git push origin HEAD:main || echo "main non avanzato"
